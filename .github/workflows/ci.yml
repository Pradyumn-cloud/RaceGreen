name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans the pushed commit range and needs its parent.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check . --select E4,E7,E9,F,I
      - name: Mypy
        # The legacy modules still have tracked typing debt; keep the release
        # gate strict for the Phase 7 trace/report surface.
        run: uv run mypy src/racegreen/storage src/racegreen/report.py src/racegreen/cli.py
      - name: Tests
        run: uv run pytest
      - name: Demo quickstart
        run: uv run racegreen demo --artifacts-root "$RUNNER_TEMP/racegreen-demo"
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit
        run: uvx --from pip-audit pip-audit
