name: Bug report
description: Report a reproducible RaceGreen defect without sharing secrets.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste provider credentials, private repository contents, or
        unredacted environment dumps. For security issues use SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Commands, repository shape, and the smallest failing case.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RaceGreen version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - WSL2
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Output of racegreen doctor, run state, and relevant event names.
      render: shell
