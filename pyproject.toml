[project]
name = "racegreen"
version = "0.1.0"
description = "Verified, isolated coding-agent races"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Pradyumn-cloud" }]
keywords = ["agents", "coding", "git", "race", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/Pradyumn-cloud/RaceGreen"
Repository = "https://github.com/Pradyumn-cloud/RaceGreen"
Issues = "https://github.com/Pradyumn-cloud/RaceGreen/issues"
Changelog = "https://github.com/Pradyumn-cloud/RaceGreen/blob/main/CHANGELOG.md"

[project.scripts]
racegreen = "racegreen.cli:app"
racegreen-replay = "racegreen.cli:replay_app"

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pyyaml>=6.0,<7",
    "pytest>=9.0.3,<10",
    "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racegreen"]
