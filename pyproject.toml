[project]
name = "racegreen"
version = "0.1.0"
description = "Verified, isolated coding-agent races"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pyyaml>=6.0,<7",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racegreen"]
